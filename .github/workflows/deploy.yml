name: Deploy to Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch: # 允许在 GitHub 网页手动触发

concurrency:
  group: fly-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

# ⚠️ 使用前需在本仓库 Settings → Secrets and variables → Actions 添加：
#    FLY_API_TOKEN  = 本地执行 `fly auth token` 得到的令牌
# 应用级密钥（ZHIPU_API_KEY / SERVERCHAN_KEY / ADMIN_TOKEN）已在
# `fly secrets set` 时写入 Fly 平台，本工作流部署时自动沿用，无需在此重复。
