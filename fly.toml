# fly.toml app configuration file generated for ai-pm-portfolio on 2026-09-05T23:19:42+08:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ai-pm-portfolio'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  ANALYTICS_DIR = '/app/server/data'
  PORT = '8787'
  VISIT_PUSH_COOLDOWN_MIN = '30'
  ZHIPU_BASE = 'https://open.bigmodel.cn/api/paas/v4'
  ZHIPU_MODEL = 'glm-4-flash'

[[mounts]]
  source = 'portfolio_data'
  destination = '/app/server/data'

[[services]]
  protocol = 'tcp'
  internal_port = 8787

  [[services.ports]]
    port = 80
    handlers = ['http']

  [[services.ports]]
    port = 443
    handlers = ['tls', 'http']

  [services.concurrency]
    type = 'connections'
    hard_limit = 50
    soft_limit = 25

  [[services.http_checks]]
    interval = '15s'
    grace_period = '5s'
    method = 'get'
    path = '/health'
    protocol = 'http'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
